plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pure.translate'
    compileSdk 34

    defaultConfig {
        applicationId "com.pure.translate"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'

    // OCR على الجهاز نفسه - مجاني بالكامل وبدون مفتاح API (يدعم لاتيني/عربي عبر موديل عربي منفصل)
    implementation 'com.google.mlkit:text-recognition:16.0.0'

    // ترجمة على الجهاز نفسه (تنزل موديل اللغة مرة وحدة ثم تشتغل offline بالكامل) - مجانية وبدون مفتاح API
    implementation 'com.google.mlkit:translate:17.0.2'
}
