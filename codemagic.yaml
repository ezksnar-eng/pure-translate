workflows:
  android-native-build:
    name: Pure APK Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Build Android Debug APK
        script: |
          gradle assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/**/*.apk
      
